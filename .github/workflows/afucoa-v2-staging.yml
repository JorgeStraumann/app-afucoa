name: AFUCOA V2 staging

on:
  push:
    branches:
      - afucoa-v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: afucoa-v2-staging
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/afucoa-v2' && vars.AFUCOA_DEV_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-latest
    env:
      VITE_AFUCOA_MODE: supabase
      VITE_SUPABASE_URL: https://imiplnspvmsrsuikulwm.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AFUCOA_DEV_PUBLISHABLE_KEY }}
      VITE_AUTH_ALIAS_DOMAIN: auth.afucoa.local
      AFUCOA_PUBLIC_BASE: /app-afucoa/
    steps:
      - name: Checkout afucoa-v2
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production operations contract (no activation)
        run: pnpm test:prod-operations

      - name: Validate production hosting contract (no deploy)
        run: pnpm test:prod-hosting

      - name: Validate synthetic production artifact (no deploy)
        run: pnpm test:prod-artifact

      - name: Build and validate staging artifact
        # This rebuilds dist with the DEV staging contract after the synthetic
        # production check. Only this final staging dist is uploaded below.
        run: pnpm test:staging

      - name: Auth recovery and synthetic pilot regression tests
        run: pnpm test:recovery && pnpm test:session && pnpm test:push && pnpm test:navigation && pnpm test:pilot

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/afucoa-v2' && vars.AFUCOA_DEV_PUBLISHABLE_KEY != ''
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy staging to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
