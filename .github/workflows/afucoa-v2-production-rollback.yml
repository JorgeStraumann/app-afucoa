name: AFUCOA V2 production rollback

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Successful production deployment UUID from afucoa-v2-prod
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: afucoa-v2-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://afucoa-v2-prod.pages.dev
    steps:
      - name: Reject branch, preview, or malformed identifiers
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/afucoa-v2' ]]
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]

      - name: Checkout approved rollback tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked rollback tooling
        run: pnpm install --frozen-lockfile

      - name: Validate target is successful production from afucoa-v2-prod
        id: target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node scripts/cloudflare-pages-release.mjs inspect \
            --deployment-id "${{ inputs.deployment_id }}" \
            --output "$RUNNER_TEMP/rollback-target.json"

      - name: Roll back through the official Cloudflare Pages API
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node scripts/cloudflare-pages-release.mjs rollback \
            --deployment-id "${{ inputs.deployment_id }}" \
            --output "$RUNNER_TEMP/rollback-result.json"

      - name: Smoke canonical origin after rollback
        env:
          AFUCOA_PROD_PUBLISHABLE_KEY: ${{ vars.AFUCOA_PROD_PUBLISHABLE_KEY }}
        run: |
          node scripts/production-smoke.mjs \
            --origin "${{ vars.AFUCOA_PROD_ORIGIN }}" \
            --release-sha "${{ steps.target.outputs.release_sha }}" \
            --deployment-id "${{ inputs.deployment_id }}" \
            --attempts 12 \
            --output "$RUNNER_TEMP/rollback-smoke.json"

      - name: Record rollback evidence
        shell: bash
        run: |
          {
            echo '## AFUCOA V2 production rollback'
            echo '- Target deployment: `${{ inputs.deployment_id }}`'
            echo '- Target release SHA: `${{ steps.target.outputs.release_sha }}`'
            echo '- Target verified as production/success: yes'
            echo '- Rebuild: no'
            echo '- New artifact: no'
            echo '- Canonical smoke: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public rollback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: afucoa-v2-prod-rollback-${{ inputs.deployment_id }}
          path: |
            ${{ runner.temp }}/rollback-target.json
            ${{ runner.temp }}/rollback-result.json
            ${{ runner.temp }}/rollback-smoke.json
          if-no-files-found: error
          retention-days: 90
